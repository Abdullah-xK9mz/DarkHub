<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الطائر المغامر Pro 🐦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/pages/flappy.css">
  <link rel="stylesheet" href="../css/features.css">
</head>
<body>
    <div id="game-container">
        <div class="score-board" id="score-val">0</div>

        <button class="pause-btn" id="pause-btn">⏸</button>

        <div id="pauseOverlay">
            <h2>⏸ توقف مؤقت</h2>
            <div class="pause-actions">
                <button class="pause-resume" id="resume-btn">استمرار ▶️</button>
                <button class="btn-main" style="padding:12px 20px; font-size:14px; background:var(--panel); color:var(--ink); border: 1px solid var(--panel-line);" onclick="window.location.href='games.html'">الألعاب 🎮</button>
            </div>
        </div>

        <div id="msg-screen">
            <div class="eyebrow">تحدي رد الفعل السريع</div>
            <h2 id="msg-title">طير وتحدى أصحابك! 🐦</h2>
            <p id="msg-desc">اضغط على الشاشة أو مسطرة الكيبورد Space لتجعل العصفور يطير.</p>
            <button class="btn-start" id="start-btn">إبدأ اللعب 🎮</button>
        </div>

        <div id="bird"></div>
    </div>

    <script src="../js/pages/flappy.js"></script>
</body>
</html>
