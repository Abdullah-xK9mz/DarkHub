<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة إكس أو | تحدي الذكاء والتكتيك</title>
    <link rel="stylesheet" href="../css/pages/ox.css">
  <link rel="stylesheet" href="../css/features.css">
</head>
<body>

  <div id="page-ox" class="view-page">
    <div id="ox-winOverlay" class="overlay-modal">
      <h2 id="ox-winTitle">🏆 الفائز!</h2>
      <p id="ox-winDesc">تهانينا على الأداء الممتاز</p>
      <button class="win-btn" onclick="resetOxGame()">جولة جديدة 🔄</button>
    </div>

    <div class="eyebrow">تحدي الذكاء والتكتيك</div>
    <h1>لعبة <span>إكس أو</span> ❌⭕</h1>

    <div class="hud">
      <div class="stat-pill stat-player">اللاعب (X): <b id="ox-score-x">0</b></div>
      <div class="stat-pill stat-comp">الخصم (O): <b id="ox-score-o">0</b></div>
      <div class="select-wrap">
        <select id="ox-mode" onchange="resetOxGame()">
          <option value="ai-easy">ضد الكمبيوتر (سهل) 🥱</option>
          <option value="ai-hard" selected>ضد الكمبيوتر (ذكي) 🧠</option>
          <option value="pvp">لاعبين (نفس الجهاز) 👥</option>
        </select>
      </div>
    </div>

    <div class="ox-grid" id="ox-grid"></div>

    <div class="actions">
      <button class="btn-nav-back" style="color:var(--cyan); border-color:var(--cyan);" onclick="resetOxGame()">جولة جديدة 🔄</button>
<button class="btn-nav-back" onclick="window.location.href='games.html'">الألعاب 🎮</button>
  </div>

  <script src="../js/pages/ox.js"></script>
</body>
</html>
