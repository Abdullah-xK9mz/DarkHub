<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحميل بدون علامه مائيه</title>
    <link rel="stylesheet" href="../css/pages/tiktok-downloader.css">
  <link rel="stylesheet" href="../css/features.css">
</head>
<body>

<div class="container">
    <h1>تحميل فيديوهات وصور تيك توك</h1>
    <p class="subtitle">يمكنك تحميل حتى خمسة روابط في المرة الواحدة (بأعلى جودة HD)</p>

    <div class="input-group">
        <textarea id="linksInput" placeholder="ضع روابط التيك توك هنا...&#10;مثال: https://vm.tiktok.com/"></textarea>
        <button type="button" class="btn-paste" id="pasteBtn">📋 لصق من الحافظة</button>
        <div style="clear:both;"></div>
    </div>
    
    <button class="btn-main" onclick="processLinks()">بدء التحليل والتحميل</button>
    <a href="Tools.html" class="btn-back">⬅️ الرجوع للخلف</a>

    <div class="loader" id="loader">جاري جلب الفيديوهات بأعلى جودة أصلية...</div>

    <div class="results-grid" id="results"></div>
</div>

<div class="modal" id="imageModal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modalImage" src="" alt="معاينة المكبرة">
</div>

<script src="../js/pages/tiktok-downloader.js"></script>
</body>
</html>
